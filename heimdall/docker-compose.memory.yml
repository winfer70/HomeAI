services:
  heimdall-memory:
    build: ./memory_service
    container_name: heimdall-memory
    environment:
      - HEIMDALL_MEMORY_TOKEN=${HEIMDALL_MEMORY_TOKEN:?set in .env}
      - HEIMDALL_MEMORY_DB=/data/memory.db
      - OLLAMA_URL=http://host.docker.internal:11434
      - HEIMDALL_EXTRACTION_MODEL=qwen2.5:7b-instruct
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/memory:/data
    ports:
      - "10400:10400"
    restart: unless-stopped

  heimdall-memory-poller:
    build:
      context: .
      dockerfile: poller/Dockerfile
    container_name: heimdall-memory-poller
    environment:
      - HEIMDALL_HA_URL=ws://192.168.0.108:8123/api/websocket
      - HEIMDALL_HA_TOKEN=${HEIMDALL_HA_TOKEN:?set in .env - HA long-lived access token}
      - HEIMDALL_MEMORY_URL=http://heimdall-memory:10400
      - HEIMDALL_MEMORY_TOKEN=${HEIMDALL_MEMORY_TOKEN:?set in .env}
      - HEIMDALL_POLL_INTERVAL_SECONDS=60
    depends_on:
      - heimdall-memory
    restart: unless-stopped
